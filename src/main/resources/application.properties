spring.application.name=tutorias

spring.config.import=optional:file:.env[.properties]

server.port=${PORT:8080}

# Detrás del proxy de Render: getRemoteAddr() toma la IP del cliente de
# X-Forwarded-For (solo si la conexión viene de una red interna).
server.forward-headers-strategy=native

# JWT propio (HS256). API_KEY debe tener al menos 32 caracteres.
api.key=${API_KEY}
api.jwt.expiration=${API_JWT_EXPIRATION}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# El esquema lo crea db/supabase/001_esquema.sql; Hibernate solo valida que
# las entidades coincidan con él al arrancar.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

sendgrid.api-key=${SENDGRID_API_KEY}
sendgrid.from=${SENDGRID_FROM}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Freno a la fuerza bruta en POST /auth/signin (docs/AUTENTICACION.md).
# Al llegar al maximo de fallos, la cuenta o la IP esperan a que termine
# la ventana.
auth.intentos.max-por-cuenta=5
auth.intentos.max-por-ip=30
auth.intentos.ventana-minutos=15

# Dominios de correo aceptados en POST /auth/signup, separados por coma.
# Vacío = cualquier dominio.
auth.local.dominios=estudiantes.uv.mx,gmail.com

# SOLO PRUEBAS: habilita POST /auth/dev (login por correo sin contraseña).
# Nunca activarlo en un despliegue público.
auth.dev.habilitado=${AUTH_DEV_HABILITADO:false}
