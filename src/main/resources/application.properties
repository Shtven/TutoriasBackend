spring.application.name=tutorias

spring.config.import=optional:file:.env[.properties]

server.port=${PORT:8080}

# JWT propio (HS256). API_KEY debe tener al menos 32 caracteres.
api.key=${API_KEY}
api.jwt.expiration=${API_JWT_EXPIRATION}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# El esquema lo crea db/supabase/001_esquema.sql; Hibernate solo valida que
# las entidades coincidan con él al arrancar.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

sendgrid.api-key=${SENDGRID_API_KEY}
sendgrid.from=${SENDGRID_FROM}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Login con proveedores externos (docs/AUTENTICACION.md)
auth.google.client-id=${GOOGLE_CLIENT_ID:}
auth.google.dominio=gmail.com
auth.microsoft.client-id=${MICROSOFT_CLIENT_ID:}
auth.microsoft.tenant-id=${MICROSOFT_TENANT_ID:}
auth.microsoft.dominio=estudiantes.uv.mx
auth.registro.expiracion-minutos=15

# Registro con contraseña (POST /auth/signup): dominios de correo aceptados,
# separados por coma. Vacío = cualquier dominio.
auth.local.dominios=estudiantes.uv.mx,gmail.com

# SOLO PRUEBAS: habilita POST /auth/dev (login por correo sin proveedor).
# Nunca activarlo en un despliegue público.
auth.dev.habilitado=${AUTH_DEV_HABILITADO:false}
