# Pruebas de integración contra PostgreSQL real.
# Por defecto usa una BD local; se puede apuntar a otra con TEST_DB_URL.
spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5433/tutorias_test}
spring.datasource.username=${TEST_DB_USERNAME:postgres}
spring.datasource.password=${TEST_DB_PASSWORD:}

# El esquema lo crea EsquemaPrueba (db/supabase/001_esquema.sql) antes de
# levantar el contexto; Hibernate después lo valida (ddl-auto=validate).

api.key=clave-de-pruebas-de-al-menos-32-caracteres!!
api.jwt.expiration=3600000

sendgrid.api-key=SG.prueba
sendgrid.from=noreply@prueba.mx
cors.allowed-origins=http://localhost:5173, http://localhost:4173/ ,https://tutorias-front-pr-*.onrender.com

auth.dev.habilitado=true
app.tareas.habilitadas=false
